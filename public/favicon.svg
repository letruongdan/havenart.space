<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#121316"/>
  <!-- Subtle calm ambient glow -->
  <circle cx="32" cy="32" r="24" fill="url(#ambientGlow)" opacity="0.15"/>
  <!-- Minimalist Zen Ensō circle / Haven Arc -->
  <path
    d="M32 10C19.85 10 10 19.85 10 32C10 44.15 19.85 54 32 54C41.28 54 49.26 48.24 52.48 40.1"
    stroke="url(#havenGold)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <!-- Inner calm star / serene focal dot -->
  <circle cx="32" cy="32" r="3.5" fill="#f5d799" opacity="0.9"/>
  <circle cx="32" cy="32" r="6" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  <defs>
    <radialGradient id="ambientGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#f5d799"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="havenGold" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
</svg>
